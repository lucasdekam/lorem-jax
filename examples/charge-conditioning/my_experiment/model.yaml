model:
  lorem.Lorem:
    cutoff: 6.0
    max_degree_lr: 2
    num_features: 32
    max_degree: 3
    num_message_passing: 1
    num_spherical_features: 4
    lr: false
    # "film" modulates the node features on Q; "quadratic" instead expands the
    # energy as E0 + Phi0 Q + kappa Q^2/2 with learned per-structure
    # coefficients; "quadratic_film" adds a FiLM residual on top of that.
    charge_conditioning: "film"
